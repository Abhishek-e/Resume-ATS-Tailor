databases:
  - name: resumify-db
    databaseName: resumify_db
    plan: free

services:
  - type: web
    name: resume-ats-tailor
    runtime: python

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resumify-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
