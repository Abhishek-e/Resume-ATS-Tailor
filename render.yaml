services:
  - type: web
    name: resume-ats-tailor
    # Plain Python runtime - no Dockerfile, no browser engine, no system
    # packages. Everything here installs from PyPI on the free plan.
    runtime: python
    plan: free
    healthCheckPath: /

    buildCommand: pip install -r requirements.txt
    # One worker with threads, not multiple processes: the job listing cache
    # lives in process memory, so a second worker would hold its own copy and
    # "Refresh listings" would only update whichever one served the request.
    # Threads give the concurrency without splitting that cache.
    startCommand: >-
      gunicorn app:app
      --workers 1
      --threads 8
      --timeout 120
      --access-logfile -

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false

      # Firebase Auth (Google sign-in). Only the web API key is needed - the
      # auth domain and project id are derived from the service account.
      # Public by design: every Firebase web app ships this in page source.
      # Unset, the Google button does not render and email sign-in is
      # unaffected. Google must also be enabled under Authentication >
      # Sign-in method, with the Render domain in Authorised domains.
      - key: FIREBASE_WEB_API_KEY
        sync: false
      # Both optional - only set them if they differ from the service account.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false

      # --- Find Jobs -----------------------------------------------------
      # Comma-separated. Board tokens come from the careers-page URL:
      # boards.greenhouse.io/<token> and jobs.lever.co/<company>.
      # Greenhouse postings are the ones that open pre-filled, so favour
      # employers who host on boards.greenhouse.io rather than their own domain.
      - key: GREENHOUSE_BOARDS
        value: "figma,gitlab,discord"
      - key: LEVER_COMPANIES
        value: "leverdemo"
      - key: WWR_CATEGORY
        value: "remote-programming-jobs"
      # Optional extra source; stays off unless a free key is supplied.
      # https://developer.usajobs.gov/
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false
      # Optional. Enables Java / C / C++ on the practice desk by proxying to
      # Judge0 CE (free tier on RapidAPI). JavaScript and Python run entirely
      # in the browser and need nothing here.
      - key: JUDGE0_RAPIDAPI_KEY
        sync: false

      # Politeness delay between board requests during a refresh.
      - key: FETCH_DELAY_SECONDS
        value: "1.0"
