<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin sign in &middot; {{ site.app_name }}</title>
    <meta name="robots" content="noindex, nofollow">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('resumify-theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-bs-theme', saved);
                }
            } catch (e) { /* private mode - stay on the default light theme */ }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/tabler/css/tabler.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex flex-column">
<div class="page page-center">
    <div class="container container-tight py-4">
        <div class="text-center mb-4">
            <div class="admin-login-brand">{{ site.app_name }}</div>
            <div class="text-secondary">Administrator access</div>
        </div>

        <div class="card card-md">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Sign in to the admin panel</h2>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" autocomplete="off">
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label class="form-label" for="admin-email">Email</label>
                        <input type="email" id="admin-email" name="email" class="form-control"
                               placeholder="admin@example.com" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="admin-password">Password</label>
                        <input type="password" id="admin-password" name="password"
                               class="form-control" placeholder="Password" required>
                    </div>
                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100">Sign in</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center text-secondary mt-3">
            <a href="{{ url_for('home') }}">Back to {{ site.app_name }}</a>
        </div>
    </div>
</div>
</body>
</html>
