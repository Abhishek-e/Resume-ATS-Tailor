{% extends "base.html" %}
{% block title %}Register - Resumify{% endblock %}

{% block content %}
    <!-- Register Form -->
    <div class="form-container">
        <h2>Create your account</h2>
        
        

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">Full Name</label>
                <input type="text" id="username" name="username" placeholder="Enter your full name" required class="form-control">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required class="form-control">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required class="form-control">
            </div>
            <button type="submit" class="submit-btn">Get Started</button>
        </form>
        <p class="link-text">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
{% endblock %}
