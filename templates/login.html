<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Resumify</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Promotional Banner -->
    <!--
    <div class="promo-banner" id="promoBanner">
        <span class="promo-text">For a limited time, get premium features free. Use code at checkout:</span>
        <span class="promo-code">RESUMIFY2026</span>
        <button class="close-btn" onclick="document.getElementById('promoBanner').style.display='none'">×</button>
    </div>
-->

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="{{ url_for('home') }}" class="nav-logo">RESUMIFY</a>
        </div>
        <div class="nav-center">
            <a href="#" class="nav-link">Features <span class="chevron">⌄</span></a>
            <a href="#" class="nav-link">Templates <span class="chevron"></span></a>
            <a href="#" class="nav-link">Resources <span class="chevron">⌄</span></a>
        </div>
        <div class="nav-right">
            <a href="{{ url_for('register') }}" class="nav-btn-primary">Get Started</a>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="form-container">
        <h2>Welcome back</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="submit-btn">Log In</button>
        </form>
        <p class="link-text">Don't have an account? <a href="{{ url_for('register') }}">Get started</a></p>
    </div>
</body>
</html>
